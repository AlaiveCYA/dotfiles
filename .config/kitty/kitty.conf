# Cozy Rosewood 🌸
 
# Font
font_family Maple Mono NF
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto
 
# Background and text
background #453633
foreground #E8BFC3
background_opacity 1.0
dynamic_background_opacity no
 
# Cursor
cursor #F2A7B5
cursor_text_color #453633
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
 
# Selection
selection_background #78565D
selection_foreground #FFF0E8
 
# Window
window_padding_width 14
remember_window_size yes
initial_window_width 1100
initial_window_height 700
 
# Behavior
enable_audio_bell no
confirm_os_window_close 0
scrollback_lines 10000
 
# URLs
url_color #F2A7B5
url_style curly
 
# Search
search_foreground #453633
search_background #D9B6A0
 
# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_bar_background #352927
active_tab_foreground #453633
active_tab_background #AEC491
inactive_tab_foreground #E8BFC3
inactive_tab_background #453633
tab_title_template {title}
 
# Black
color0 #453633
color8 #8E7374
 
# Rose
color1 #D78791
color9 #F2A7B5
 
# Sage
color2 #A3B18A
color10 #C0D0A2
 
# Honey
color3 #D9B887
color11 #F0D0A0
 
# Blue
color4 #91ABC9
color12 #B1C8E3
 
# Mauve
color5 #C5A0BD
color13 #E0B7D6
 
# Teal
color6 #92B9B3
color14 #B0D4CE
 
# Cream
color7 #E8D9CB
color15 #FFF2E8
 
 
 
# Normal desktop copy and paste
map ctrl+v paste_from_clipboard

initial_window_width 80c
initial_window_height 25c

# Remove internal padding
window_padding_width 0

# Remove gaps between windows
window_margin_width 0
shell /usr/bin/zsh
